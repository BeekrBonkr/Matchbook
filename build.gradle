plugins {
    id "java"
    id "com.github.johnrengelman.shadow" version "8.1.1"
}

group = "com.slg"
version = "0.6.10"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url = "https://repo.extendedclip.com/content/repositories/placeholderapi/" }
    maven { url = "https://repo.papermc.io/repository/maven-public/" }

    // MBedwars API repo (per official docs)
    maven { url = "https://repo.marcely.de/repository/maven-public/" }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT"
    compileOnly "de.marcely.bedwars:API:5.5.6"
    compileOnly "me.clip:placeholderapi:2.11.6"

    // MySQL support (shaded into the final jar)
    implementation "com.zaxxer:HikariCP:5.1.0"
    implementation "com.mysql:mysql-connector-j:9.0.0"
}

shadowJar {
    archiveClassifier.set("")
    // Keep dependencies inside one jar for admin UX.
    // (Relocation is optional; leave it off to reduce surprises with JDBC SPI.)
}

// The plain `jar` task doesn't include HikariCP/mysql-connector-j (they're `implementation`
// deps, only bundled by shadowJar), so it produces a plugin jar that throws
// NoClassDefFoundError on MySQL storage the moment it's dropped on a server. Both tasks write
// to the same build/libs/Matchbook-<version>.jar filename (shadowJar's classifier is set to ""
// above), so leaving `jar` enabled is a race that can silently overwrite the working shaded jar
// with the broken thin one. Disable it outright and make `assemble`/`build` produce only the
// shaded jar.
tasks.named("jar") {
    enabled = false
}
tasks.named("assemble") {
    dependsOn(tasks.named("shadowJar"))
}

// Convenience alias: some admins type `shadowjar` (lowercase).
tasks.register("shadowjar") {
    dependsOn(tasks.named("shadowJar"))
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}
