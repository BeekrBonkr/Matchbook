# ============================================================
#  Matchbook Configuration
#  Plugin version: 0.6.2  |  Config version: 0.0.9
#
#  When you update the plugin, Matchbook will automatically:
#    1. Back up your current config  (config.yml.bak-<version>-<date>)
#    2. Add any new keys with default values
#    3. Preserve all your existing settings
#
#  You should never need to edit config-version manually.
# ============================================================

# Internal config schema version — do not change this.
config-version: "0.0.9"

# ============================================================
#  Storage
# ============================================================
storage:
  # Backend for saving match data.
  #   yaml  — flat files under plugins/MBedwars/add-ons/Matchbook/matches/
  #           Suitable for small servers; no database required.
  #   mysql — stores each match as a YAML document in a MySQL/MariaDB table.
  #           Better for large servers or when you need shared access / backups.
  type: yaml

  # MySQL settings — only used when type is set to "mysql".
  mysql:
    host: "127.0.0.1"
    port: 3306
    database: "matchbook"
    username: "matchbook"
    password: "change_me"

    # Optional JDBC URL parameters appended after the database name.
    # Separate with & for multiple params.
    # Example: "useUnicode=true&characterEncoding=utf8&useSSL=false"
    params: "useUnicode=true&characterEncoding=utf8&useSSL=false"

    # Table prefix — useful if multiple servers share one database.
    # Tables created: <prefix>matches, <prefix>player_matches
    table_prefix: "matchbook_"

    # Connection pool settings (HikariCP).
    # These defaults are fine for most servers; raise maximum_pool_size
    # if you have high concurrency (many simultaneous match saves).
    pool:
      maximum_pool_size: 10
      minimum_idle: 2
      connection_timeout_ms: 10000
      idle_timeout_ms: 300000
      max_lifetime_ms: 1800000

# ============================================================
#  Match recording
# ============================================================
match:
  # Enforce win/loss flags from the match result rather than relying solely on
  # MBedwars incrementing bedwars:wins / bedwars:loses.
  # Recommended: true — prevents stat contamination when MBedwars updates stats late.
  enforce_win_loss_from_result: true

  # Broadcast the match code in chat to all participants when a match file is saved.
  # Useful so players can immediately use /mb view <code>.
  announce_match_code: true

  # Delay in ticks before taking the "start snapshot" of player stats.
  # A short delay lets MBedwars finish its own setup before Matchbook reads stats.
  # 20 ticks = 1 second. Range: 0–1200.
  start_snapshot_delay_ticks: 20

  # Delay in ticks before taking the "end snapshot" after a round ends.
  # A short delay lets MBedwars commit final stat updates first.
  end_snapshot_delay_ticks: 10

  # How many ticks to wait for MBedwars to report the match as RUNNING
  # before giving up and trying to snapshot anyway. Range: 1–72000.
  running_wait_ticks_max: 100

  # How long (in ticks) to wait for individual player stat callbacks before
  # marking the snapshot as timed-out and continuing without that player.
  snapshot_timeout_ticks: 40

  # Stat keys to snapshot from MBedwars at match start and end.
  # The diff (end - start) is what gets saved in each match file.
  # Add extra keys from /mb statskeys if you want to track more.
  # Remove keys you don't need to keep match files smaller.
  tracked_keys:
    - "bedwars:kills"
    - "bedwars:final_kills"
    - "bedwars:deaths"
    - "bedwars:final_deaths"
    - "bedwars:beds_destroyed"
    - "bedwars:wins"
    - "bedwars:loses"
    - "bedwars:beds_lost"

# ============================================================
#  CSV export  (/mb export <matchcode>)
# ============================================================
export:
  # Columns to include in the exported CSV.
  # Available meta columns:  uuid, username, team
  # Available stat columns:  any key from match.tracked_keys (e.g. bedwars:kills)
  # Placement columns are added automatically when present: matchbook:1st_place, etc.
  #
  # Leave empty to use smart defaults: uuid, username, team + all tracked_keys.
  #
  # Example:
  #   columns:
  #     - uuid
  #     - username
  #     - team
  #     - bedwars:kills
  #     - bedwars:final_kills
  #     - bedwars:deaths
  columns: []

# ============================================================
#  Export upload (Hastebin)
# ============================================================
export_upload:
  # Set to true to automatically upload CSV exports to a Hastebin-compatible server
  # after every /mb export. The file is always saved locally regardless of this setting.
  enabled: false

  # URL of the Hastebin-compatible server to upload to (no trailing slash).
  # Default is the official Hastebin. Any compatible self-hosted or alternative
  # instance works here (e.g. https://hst.sh).
  # Note: pastes are public and have no built-in expiry guarantee.
  server: "https://hastebin.com"

# ============================================================
#  Placeholder reliability  (PlaceholderAPI)
# ============================================================
placeholder:
  # Seconds to keep a player's last-known match code cached after a match ends.
  # Scoreboards often keep showing placeholders during the end screen / transition,
  # so this prevents %matchbook_matchcode% from going blank too early.
  # Minimum: 5. Recommended: 30–120.
  grace_seconds: 60

# ============================================================
#  Logging
# ============================================================
logging:
  # Set to true for verbose debug output in the server console.
  # Useful when diagnosing issues; leave false on production.
  debug: false

# ============================================================
#  Rejoin memory
# ============================================================
# MBedwars can remember a player's arena and prompt them to rejoin after disconnect.
# When a player leaves mid-match and then joins a different arena, that rejoin memory
# can block them. These settings let Matchbook auto-disable it on common transitions.
rejoin:
  # Disable rejoin when a player deliberately disconnects or uses /leave.
  disable_on_leave: true

  # Disable rejoin when a player is teleported out of an arena.
  disable_on_teleport: true

  # Disable rejoin when a player switches to a different arena.
  disable_on_switch_arena: true
