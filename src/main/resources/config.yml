# Do not change this!!!
config-version: "0.0.6"

# Matchbook configuration

storage:
  # yaml or mysql
  type: yaml

  # When mysql is selected
  mysql:
    host: "127.0.0.1"
    port: 3306
    database: "matchbook"
    username: "matchbook"
    password: "change_me"
    # Optional: append URL params. Example: "useUnicode=true&characterEncoding=utf8"
    params: "useUnicode=true&characterEncoding=utf8&useSSL=false"
    # Table prefix so multiple networks can share one DB.
    table_prefix: "matchbook_"
    pool:
      maximum_pool_size: 10
      minimum_idle: 2
      connection_timeout_ms: 10000
      idle_timeout_ms: 300000
      max_lifetime_ms: 1800000

match:
  # When MBedwars doesn't update win/loss quickly enough, enforce wins/loses from the match result.
  # If a tie or aborted match, no wins/loses are forced.
  enforce_win_loss_from_result: true

  # If enabled, when a match file is saved, print the match code in chat to all participants.
  announce_match_code: true

  # Limits for snapshot waiting/retry
  start_snapshot_delay_ticks: 20
  end_snapshot_delay_ticks: 10
  running_wait_ticks_max: 100
  snapshot_timeout_ticks: 40

  # Track these stat keys from MBedwars player data API
  # Add more keys if you want; Matchbook will store them and export diffs if present.
  tracked_keys:
    - "bedwars:kills"
    - "bedwars:final_kills"
    - "bedwars:deaths"
    - "bedwars:final_deaths"
    - "bedwars:beds_destroyed"
    - "bedwars:wins"
    - "bedwars:loses"
    - "bedwars:beds_lost"

# CSV export settings
# If export.columns is omitted/empty, Matchbook will default to: uuid, username, team + match.tracked_keys
export:
  # Example:
  # columns:
  #   - uuid
  #   - username
  #   - team
  #   - bedwars:kills
  #   - bedwars:deaths
  columns: []

# Upload CSV exports to Pastebin so players don't have to find files on disk
export_upload:
  enabled: false
  # Safety: /matchbook test --pastebin will only create a real paste if this is true.
  # This prevents accidental Pastebin spam on production servers.
  allow_test_paste: false
  # Paste title prefix
  paste_name_prefix: "Matchbook Export"
  # 0=public, 1=unlisted (recommended)
  unlisted: true
  # Paste expiry: N (never), 10M, 1H, 1D, 1W, 2W, 1M, 6M, 1Y
  expire: "1W"
  pastebin:
    api_dev_key: ""
    # Optional: create pastes under a Pastebin account (requires generating an api_user_key)
    api_user_key: ""


# Placeholder reliability settings
placeholder:
  # How long (in seconds) to keep a "last known" match code for players after a match ends.
  # This helps scoreboards that keep placeholders visible during end screens / transitions.
  grace_seconds: 60


logging:
  debug: false

# Rejoin-memory can block players from joining other arenas while their old match is still running.
# Matchbook can force-disable rejoin when players leave/teleport/switch arenas.
rejoin:
  disable_on_leave: true
  disable_on_teleport: true
  disable_on_switch_arena: true
