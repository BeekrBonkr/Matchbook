name: Matchbook
main: com.slg.matchbook.MatchbookPlugin
version: 0.4.5
api-version: "1.21"
depend: [MBedwars]
softdepend: [PlaceholderAPI]

commands:
  matchbook:
    description: "Matchbook root command"
    aliases: [mb]
    usage: "/mb help"
    permission: mb.command.use

permissions:
  # New permission model (recommended)
  mb.command.use:
    description: "Allows using /mb at all"
    default: true

  mb.command.default:
    description: "Grants access to common Matchbook commands"
    default: true
    children:
      mb.command.matches: true
      mb.command.all: true
      mb.command.view: true
      mb.command.export: true
      mb.command.help: true

  mb.command.admin:
    description: "Grants access to admin Matchbook commands"
    default: op
    children:
      mb.command.migrate: true
      mb.command.reload: true
      mb.command.statskeys: true
      mb.command.test: true

  mb.command.matches:
    description: "/mb matches"
    default: false

  mb.command.all:
    description: "/mb all"
    default: false

  mb.command.view:
    description: "/mb view <matchcode>"
    default: false

  mb.command.export:
    description: "/mb export <matchcode[,matchcode...]>"
    default: false

  mb.command.help:
    description: "/mb help"
    default: false

  mb.command.migrate:
    description: "/mb migrate yaml2mysql|mysql2yaml [--dry-run]"
    default: false

  mb.command.reload:
    description: "/mb reload"
    default: false

  mb.command.statskeys:
    description: "/mb statskeys [player]"
    default: false

  mb.command.test:
    description: "/mb test [--pastebin]"
    default: false

  # Legacy nodes (kept for backwards compatibility)
  matchbook.admin:
    description: "Legacy admin permission"
    default: op

  matchbook.matches:
    description: "Legacy: Allows a player to open their match history GUI"
    default: false

  matchbook.migrate:
    description: "Legacy: Allows migrating Matchbook data between YAML and MySQL"
    default: op
